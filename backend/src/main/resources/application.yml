spring:
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:mock-key-for-tests}
        chat:
          options:
            model: ${app.ai.summary.model-id}
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:sqlite:/data/blog.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      connection-init-sql: PRAGMA foreign_keys=ON
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format-sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  engagement:
    allowed-origins: https://blog.yehyeok.xyz
    cookie-secure: true
  ai:
    summary:
      model-id: "gemini-3.5-flash-lite"
      prompt-version: "v1"
      generation-timeout: 30s
      heartbeat-interval: 15s
      daily-quota: 500
      timezone: "Asia/Seoul"
      max-concurrent-generations: 5
